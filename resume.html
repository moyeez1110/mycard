<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Builder – జన సేవా కేంద్రం</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  /* ── Site theme (dark) ── */
  --bg:      #0a0f1a;
  --bg2:     #111827;
  --bg3:     #1a2235;
  --card:    #151e2e;
  --border:  rgba(255,255,255,0.07);
  --accent:  #4fffb0;
  --accent2: #f87171;
  --text:    #e8edf5;
  --text2:   #8a9bb5;
  --shadow:  0 4px 24px rgba(0,0,0,0.4);
  --radius:  12px;
  --trans:   all 0.2s ease;
  --gold:    #fbbf24;
  --teal:    #4fffb0;

  /* ── Form panel vars (alias) ── */
  --panel:  var(--bg2);
  --light:  var(--bg3);
  --muted:  var(--text2);
  --font-body: 'DM Sans', 'Noto Sans Telugu', sans-serif;
  --font-display: 'DM Serif Display', serif;
  --font-te: 'Noto Sans Telugu', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh}

/* ── Header ── */
.header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;height:54px;
  box-shadow:0 2px 16px rgba(0,0,0,0.3);
}
.back-btn{
  display:flex;align-items:center;gap:8px;
  color:var(--text2);font-size:13px;font-family:var(--font-te);
  background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;padding:6px 12px;cursor:pointer;
  text-decoration:none;transition:var(--trans);
}
.back-btn:hover{color:var(--accent);border-color:var(--accent)}
.logo{font-family:var(--font-display);font-size:18px;color:var(--text);letter-spacing:.3px}
.logo span{color:var(--accent)}
.tpl-bar{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}
.tpl-bar::-webkit-scrollbar{display:none}
.tpl-label{font-size:10px;color:var(--text2);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-right:2px;flex-shrink:0}
.tb{
  border:1px solid var(--border);border-radius:6px;padding:5px 10px;
  cursor:pointer;font-size:11px;background:var(--bg3);
  color:var(--text2);font-family:var(--font-body);
  transition:var(--trans);display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;
}
.tb:hover{background:var(--card);color:var(--text);border-color:rgba(255,255,255,0.15)}
.tb.active{background:var(--accent);color:#0a0f1a;font-weight:700;border-color:var(--accent)}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.gen-btn{
  background:var(--accent);color:#0a0f1a;border:none;
  border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;
  gap:6px;transition:var(--trans);white-space:nowrap;flex-shrink:0;
}
.gen-btn:hover{background:#38e89a;box-shadow:0 4px 16px rgba(79,255,176,0.3)}

/* ── Layout ── */
.layout{display:flex;height:calc(100vh - 54px)}

/* ── Left Panel ── */
.lpanel{
  width:270px;flex-shrink:0;background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{
  display:grid;grid-template-columns:repeat(6,1fr);
  border-bottom:1px solid var(--border);background:var(--bg);
}
.tab{
  padding:9px 2px;font-size:10.5px;cursor:pointer;border:none;
  background:none;color:var(--text2);font-family:var(--font-body);
  text-align:center;border-bottom:2.5px solid transparent;
  transition:var(--trans);font-weight:500;
}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{color:var(--accent);border-bottom:2.5px solid var(--accent);background:var(--bg2);font-weight:700}
.fbody{padding:14px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.fl{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:4px;display:block;
  text-transform:uppercase;letter-spacing:.08em}
.fi{
  width:100%;font-size:13px;padding:8px 10px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg3);color:var(--text);
  font-family:var(--font-body);margin-bottom:10px;
  transition:border-color .15s;
}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,255,176,0.1)}
.fi::placeholder{color:var(--text2)}
textarea.fi{resize:vertical;line-height:1.5}
select.fi{cursor:pointer}
select.fi option{background:var(--bg2);color:var(--text)}
.fdiv{height:1px;background:var(--border);margin:10px 0}

/* Icon input wrappers */
.iw{position:relative;margin-bottom:10px}
.iw .fi{padding-left:34px;margin-bottom:0}
.iw .ii{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text2);pointer-events:none;transition:color .2s}
.iw .fi:focus~.ii,.iw .fi:not(:placeholder-shown)~.ii{color:var(--accent)}
.iw-ta{position:relative;margin-bottom:10px}
.iw-ta textarea{padding-left:34px;margin-bottom:0}
.iw-ta .ii{position:absolute;left:10px;top:12px;font-size:12px;color:var(--text2);pointer-events:none}
.iw-ta textarea:focus~.ii{color:var(--accent)}
/* Contact icon chips in preview */
.ci{display:inline-flex;align-items:center;gap:4px;font-family:Georgia,serif}
.ci i{font-size:9px;opacity:.75}

/* Summary picker */
.sum-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:10px 0 6px}
.sum-opt{
  display:block;padding:8px 10px;border:1px solid var(--border);
  border-radius:8px;cursor:pointer;margin-bottom:6px;
  transition:var(--trans);background:var(--bg3);
}
.sum-opt:hover{border-color:var(--accent);background:rgba(79,255,176,0.05)}
.sum-opt .so-title{font-size:12px;font-weight:600;color:var(--text)}
.sum-opt .so-preview{font-size:10.5px;color:var(--text2);margin-top:2px;line-height:1.4}
.sum-opt.picked{border:1.5px solid var(--accent);background:rgba(79,255,176,0.08)}
.sum-opt.picked .so-title{color:var(--accent)}

/* Skills */
.skill-row{display:flex;gap:6px;margin-bottom:10px}
.skill-row .fi{margin-bottom:0;flex:1}
.sadd{
  padding:7px 12px;background:var(--accent);color:#0a0f1a;
  border:none;border-radius:8px;cursor:pointer;font-size:12px;
  font-weight:700;font-family:var(--font-body);white-space:nowrap;
}
.sadd:hover{background:#38e89a}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pill{
  display:flex;align-items:center;gap:4px;font-size:11.5px;
  padding:4px 10px;border-radius:99px;
  background:rgba(79,255,176,0.1);color:var(--accent);
  font-weight:500;border:1px solid rgba(79,255,176,0.2);
}
.pill button{background:none;border:none;cursor:pointer;color:var(--accent);font-size:14px;line-height:1;padding:0;opacity:.6}
.pill button:hover{opacity:1}

/* Experience */
.exp-card{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:11px;margin-bottom:10px;
}
.exp-ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.exp-cl{font-size:12px;font-weight:700;color:var(--text)}
.exp-rem{
  background:none;border:none;cursor:pointer;color:var(--text2);
  font-size:12px;padding:3px 7px;border-radius:5px;
  font-family:var(--font-body);transition:var(--trans);
}
.exp-rem:hover{background:rgba(248,113,113,0.15);color:#f87171}
.add-exp{
  width:100%;padding:8px;border:1.5px dashed var(--border);
  background:none;border-radius:8px;color:var(--accent);
  font-size:12.5px;font-weight:600;cursor:pointer;
  font-family:var(--font-body);margin-bottom:10px;transition:var(--trans);
}
.add-exp:hover{background:rgba(79,255,176,0.05);border-color:var(--accent)}

/* ── Right Panel ── */
.rpanel{flex:1;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px 16px}
.doc-wrap{width:100%;max-width:560px;filter:drop-shadow(0 8px 32px rgba(0,0,0,.5))}
.doc{background:#fff;width:100%;font-family:Georgia,serif;position:relative}

@media print{
  .header,.lpanel{display:none}
  .rpanel{padding:0;background:#fff;display:block}
  .doc-wrap{filter:none;max-width:100%;box-shadow:none}
}
/* Mobile action buttons */
.mobile-actions{display:none;gap:6px;align-items:center;flex-shrink:0}
@media(max-width:768px){
  .mobile-actions{display:flex}
  .tpl-bar{display:none}
  .layout{flex-direction:column;height:auto}
  .lpanel{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:55vh}
  .rpanel{min-height:500px;padding:12px 8px}
  .header{gap:8px}
  .back-btn span{display:none}
}

<body>

<!-- Mobile template bar -->

<div class="header">
  <div style="display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> <span>వెనక్కి</span></a>
    <div class="logo">Resume<span>Builder</span></div>
  </div>
  <!-- Desktop template bar -->
  <div class="tpl-bar">
    <span class="tpl-label">Template:</span>
    <button class="tb active" onclick="setTpl('classic')" id="btn-classic"><span class="tdot" style="background:#222"></span>Classic</button>
    <button class="tb" onclick="setTpl('modern')" id="btn-modern"><span class="tdot" style="background:#3a5a9e"></span>Modern</button>
    <button class="tb" onclick="setTpl('minimal')" id="btn-minimal"><span class="tdot" style="background:#aaa"></span>Minimal</button>
    <button class="tb" onclick="setTpl('bold')" id="btn-bold"><span class="tdot" style="background:#c0392b"></span>Bold</button>
    <button class="tb" onclick="setTpl('executive')" id="btn-executive"><span class="tdot" style="background:#b5963e"></span>Executive</button>
    <button class="tb" onclick="setTpl('creative')" id="btn-creative"><span class="tdot" style="background:#00897b"></span>Creative</button>

    <button onclick="printResume()" style="width:36px;height:36px;border-radius:8px;background:var(--accent);border:none;color:#0a0f1a;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0" title="Download as PDF">
      <i class="fas fa-file-pdf"></i>
    </button>
  </div>
</div>

<div class="layout">
  <!-- LEFT PANEL -->
  <div class="lpanel">
    <div class="tabs">
      <button class="tab active" onclick="showSec('info')" id="t-info">Info</button>
      <button class="tab" onclick="showSec('bio')" id="t-bio">Bio</button>
      <button class="tab" onclick="showSec('exp')" id="t-exp">Exp</button>
      <button class="tab" onclick="showSec('edu')" id="t-edu">Edu</button>
      <button class="tab" onclick="showSec('skills')" id="t-skills">Skills</button>
      <button class="tab" onclick="showSec('extra')" id="t-extra">Extra</button>
    </div>

    <!-- INFO -->
    <div class="fbody" id="sec-info">
      <label class="fl">Full name</label>
      <div class="iw"><input class="fi" id="f-name" placeholder="Arjun Reddy" oninput="render()"><i class="ii fa-solid fa-user"></i></div>
      <label class="fl">Job title</label>
      <div class="iw"><input class="fi" id="f-role" placeholder="Software Engineer" oninput="render()"><i class="ii fa-solid fa-briefcase"></i></div>
      <label class="fl">Email</label>
      <div class="iw"><input class="fi" id="f-email" type="email" placeholder="you@email.com" oninput="render()"><i class="ii fa-solid fa-envelope"></i></div>
      <label class="fl">Mobile</label>
      <div class="iw"><input class="fi" id="f-phone" type="tel" placeholder="+91 98765 43210" oninput="render()"><i class="ii fa-solid fa-mobile-screen"></i></div>
      <label class="fl">City &amp; Country</label>
      <div class="iw"><input class="fi" id="f-loc" placeholder="Hyderabad, India" oninput="render()"><i class="ii fa-solid fa-location-dot"></i></div>
      <label class="fl">LinkedIn</label>
      <div class="iw"><input class="fi" id="f-linkedin" placeholder="linkedin.com/in/you" oninput="render()"><i class="ii fa-brands fa-linkedin"></i></div>
      <label class="fl">Portfolio / Website</label>
      <div class="iw"><input class="fi" id="f-web" placeholder="yoursite.com" oninput="render()"><i class="ii fa-solid fa-globe"></i></div>
    </div>

    <!-- BIO -->
    <div class="fbody" id="sec-bio" style="display:none">
      <label class="fl">Choose a summary</label>
      <div id="sum-list"></div>
      <label class="fl" style="margin-top:6px">Or write your own</label>
      <textarea class="fi" id="f-summary" style="min-height:80px" placeholder="Type a custom summary..." oninput="render()"></textarea>
      <label class="fl">Hobbies &amp; Interests</label>
      <input class="fi" id="f-hobbies" placeholder="Reading, Cricket, Blogging" oninput="render()">
    </div>

    <!-- EXP -->
    <div class="fbody" id="sec-exp" style="display:none">
      <div id="exp-list"></div>
      <button class="add-exp" onclick="addExp()">+ Add Position</button>
    </div>

    <!-- EDU -->
    <div class="fbody" id="sec-edu" style="display:none">
      <label class="fl">Degree / Qualification</label><input class="fi" id="f-deg" placeholder="B.Tech Computer Science" oninput="render()">
      <label class="fl">Institution</label><input class="fi" id="f-uni" placeholder="Osmania University" oninput="render()">
      <label class="fl">Year</label><input class="fi" id="f-eyear" placeholder="2020 – 2024" oninput="render()">
      <label class="fl">GPA / Percentage</label><input class="fi" id="f-gpa" placeholder="8.2 / 10" oninput="render()">
      <label class="fl">Relevant Coursework</label>
      <textarea class="fi" id="f-course" style="min-height:54px" placeholder="Data Structures, DBMS, Networks..." oninput="render()"></textarea>
    </div>

    <!-- SKILLS -->
    <div class="fbody" id="sec-skills" style="display:none">
      <label class="fl">Add Skill</label>
      <div class="skill-row">
        <div class="iw" style="flex:1;margin-bottom:0"><input class="fi" id="skill-inp" placeholder="e.g. Python" onkeydown="if(event.key==='Enter')addSkill()"><i class="ii fa-solid fa-layer-group"></i></div>
        <button class="sadd" onclick="addSkill()">Add</button>
      </div>
      <div class="pills" id="skill-pills"></div>
      <label class="fl">Languages</label>
      <div class="iw"><input class="fi" id="f-langs" placeholder="English (Fluent), Telugu (Native)" oninput="render()"><i class="ii fa-solid fa-language"></i></div>
      <label class="fl">Certifications</label>
      <div class="iw-ta"><textarea class="fi" id="f-certs" style="min-height:54px" placeholder="AWS Cloud Practitioner, 2024&#10;Google Digital Marketing, 2023" oninput="render()"></textarea><i class="ii fa-solid fa-certificate"></i></div>
    </div>

    <!-- EXTRA -->
    <div class="fbody" id="sec-extra" style="display:none">
      <label class="fl">Date of Birth</label>
      <div class="iw"><input class="fi" id="f-dob" placeholder="10 March 2002" oninput="render()"><i class="ii fa-solid fa-cake-candles"></i></div>
      <label class="fl">Father's Name</label>
      <div class="iw"><input class="fi" id="f-father" placeholder="Mr. Krishna Reddy" oninput="render()"><i class="ii fa-solid fa-person"></i></div>
      <label class="fl">Marital Status</label>
      <div class="iw"><select class="fi" id="f-marital" onchange="render()" style="padding-left:34px">

        <option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option>
      </select><i class="ii fa-solid fa-heart"></i></div>
      <label class="fl">Nationality</label>
      <div class="iw"><input class="fi" id="f-nationality" placeholder="Indian" oninput="render()"><i class="ii fa-solid fa-flag"></i></div>
      <label class="fl">Religion</label>
      <div class="iw"><input class="fi" id="f-religion" placeholder="Hindu" oninput="render()"><i class="ii fa-solid fa-hands-praying"></i></div>
      <div class="fdiv"></div>
      <label class="fl">Declaration Text</label>
      <div class="iw-ta"><textarea class="fi" id="f-decl" style="min-height:68px" oninput="render()">I hereby declare that all the information stated above is true and correct to the best of my knowledge and belief.</textarea><i class="ii fa-solid fa-file-signature"></i></div>
      <label class="fl">Signature Name</label>
      <div class="iw"><input class="fi" id="f-signame" placeholder="Arjun Reddy" oninput="render()"><i class="ii fa-solid fa-signature"></i></div>
      <label class="fl">Place</label>
      <div class="iw"><input class="fi" id="f-place" placeholder="Hyderabad" oninput="render()"><i class="ii fa-solid fa-location-dot"></i></div>
      <label class="fl">Date</label>
      <div class="iw"><input class="fi" id="f-date" placeholder="17 May 2026" oninput="render()"><i class="ii fa-solid fa-calendar-days"></i></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="rpanel">
    <div class="doc-wrap"><div class="doc" id="preview"></div></div>
  </div>
</div>

<script>
let tpl = 'classic', skills = [], expBlocks = [], pickedSum = null;

const SUMMARIES = [
  { cat: 'Freshers / Entry Level', color: '#2d4a3e', items: [
    { label: 'General Fresher', text: 'Enthusiastic and detail-oriented recent graduate with a strong foundation in communication, teamwork, and problem-solving. A quick learner eager to contribute fresh perspectives and a strong work ethic to a forward-thinking organization.' },
    { label: 'Tech / IT Fresher', text: 'Motivated Computer Science graduate with solid knowledge of programming, data structures, and web technologies. Passionate about building efficient, user-friendly software and excited to grow within a dynamic engineering team.' },
    { label: 'Commerce Fresher', text: 'Commerce graduate with a strong grasp of financial principles, business communication, and data analysis. Ready to apply academic knowledge in a professional setting and contribute meaningfully to business operations.' },
  ]},
  { cat: 'Experienced Professionals', color: '#1a2744', items: [
    { label: 'Mid-Level Professional', text: 'Results-driven professional with 4+ years of experience delivering high-quality outcomes in fast-paced environments. Proven track record of cross-functional collaboration, process improvement, and stakeholder management.' },
    { label: 'Senior Tech Lead', text: 'Senior software engineer with 8+ years of experience architecting scalable systems and mentoring engineering teams. Known for translating complex business requirements into robust technical solutions that drive measurable impact.' },
    { label: 'Senior Manager', text: 'Strategic and people-focused manager with 7+ years of experience leading cross-functional teams and driving organizational growth. Adept at aligning team objectives with company vision and delivering results under pressure.' },
  ]},
  { cat: 'Skilled / Trade Professionals', color: '#b5963e', items: [
    { label: 'Technical / Trade', text: 'Highly skilled and certified technical professional with extensive hands-on experience in precision work, quality control, and safe operational practices. Committed to excellence and continuous skill development.' },
    { label: 'Sales & Marketing', text: 'Dynamic sales and marketing professional with a proven ability to grow revenue, build client relationships, and execute data-driven campaigns. Skilled at identifying market opportunities and converting them into business results.' },
    { label: 'Healthcare Worker', text: 'Dedicated and compassionate healthcare professional with strong clinical knowledge and a patient-first approach. Experienced in high-pressure environments with a commitment to quality care, safety, and professional development.' },
  ]},
  { cat: 'Career Changers', color: '#c0392b', items: [
    { label: 'Returning to Workforce', text: 'Motivated professional returning to the workforce after a career break, bringing refreshed focus, updated skills, and a strong commitment to contributing value. Eager to leverage diverse life experience in a new professional chapter.' },
    { label: 'Career Switcher', text: 'Ambitious professional transitioning into a new field, bringing transferable skills in communication, project management, and analytical thinking. Backed by recent upskilling and a genuine passion for this new direction.' },
  ]},
];

function buildSumList() {
  let html = '';
  SUMMARIES.forEach((cat, ci) => {
    html += `<div class="sum-cat" style="color:${cat.color}">${cat.cat}</div>`;
    cat.items.forEach((item, ii) => {
      const id = `s_${ci}_${ii}`;
      html += `<div class="sum-opt${pickedSum===id?' picked':''}" onclick="pickSum('${id}','${item.text.replace(/'/g,"&#39;").replace(/\n/g,' ')}')">
        <div class="so-title">${item.label}</div>
        <div class="so-preview">${item.text.slice(0,72)}...</div>
      </div>`;
    });
  });

function initials(n) { return n ? n.split(' ').map(w => w[0]||'').join('').slice(0,2).toUpperCase() : '?'; }

function contactLine(email,phone,loc,linkedin,web,iconColor){
  const c=iconColor||'inherit';
  const items=[];
  if(email)   items.push(`<span class="ci"><i class="fa-solid fa-envelope" style="color:${c}"></i>${email}</span>`);
  if(phone)   items.push(`<span class="ci"><i class="fa-solid fa-mobile-screen" style="color:${c}"></i>${phone}</span>`);
  if(loc)     items.push(`<span class="ci"><i class="fa-solid fa-location-dot" style="color:${c}"></i>${loc}</span>`);
  if(linkedin)items.push(`<span class="ci"><i class="fa-brands fa-linkedin" style="color:${c}"></i>${linkedin}</span>`);
  if(web)     items.push(`<span class="ci"><i class="fa-solid fa-globe" style="color:${c}"></i>${web}</span>`);
  return items.join(' &nbsp;·&nbsp; ');
}

function expSection(T) {
  if (!expBlocks.length) return '';

    return `<div style="margin-bottom:10px">
      <div class="${T}exco">${t||'Job Title'}</div>
      <div class="${T}ext">${[c,d,l].filter(Boolean).join(' · ')}</div>
      ${desc ? `<div class="${T}exd">${desc.replace(/\n/g,'<br>')}</div>` : ''}
    </div>`;
  }).join('');
  return items;
}

/* ── Capture resume as high-quality canvas ── */
async function captureResume() {
  const preview = document.getElementById('preview');

  // Wait for fonts to fully load
  await document.fonts.ready;

  const canvas = await html2canvas(preview, {
    scale: 3,                    // High DPI — sharp output
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#ffffff',
    logging: false,
    imageTimeout: 0,
    onclone: (doc) => {
      // Make sure cloned doc fonts are loaded
      const el = doc.getElementById('preview');
      if (el) el.style.fontFamily = 'Georgia, serif';
    }
  });
  return canvas;
}

/* ── PDF Download (Desktop + Mobile) ── */
async function printResume() {
  const btn = document.querySelectorAll('.mobile-actions button')[1];
  const desktopBtn = document.querySelector('.tpl-bar .gen-btn:last-child');
  const origMobile = btn ? btn.innerHTML : '';
  const origDesktop = desktopBtn ? desktopBtn.innerHTML : '';

  if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true; }
  if (desktopBtn) { desktopBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; desktopBtn.disabled = true; }

  try {
    const canvas = await captureResume();
    const imgData = canvas.toDataURL('image/jpeg', 1.0);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4',
    });

    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = canvas.width;
    const imgH = canvas.height;
    const ratio = Math.min(pageW / (imgW * 0.2645), pageH / (imgH * 0.2645));
    const finalW = imgW * 0.2645 * ratio;
    const finalH = imgH * 0.2645 * ratio;

    pdf.addImage(imgData, 'JPEG', 0, 0, finalW, finalH);

    const name = document.getElementById('f-name').value.trim() || 'Resume';
    pdf.save(`${name}_Resume.pdf`);

  } catch(err) {
    console.error(err);
    alert('PDF error అయింది. మళ్ళీ try చేయండి.');
  }

  if (btn) { btn.innerHTML = origMobile; btn.disabled = false; }
  if (desktopBtn) { desktopBtn.innerHTML = origDesktop; desktopBtn.disabled = false; }
}

/* ── WhatsApp Share (Image) ── */
async function shareToWhatsApp() {
  const waBtn = document.querySelectorAll('.mobile-actions button')[0];
  const origHTML = waBtn ? waBtn.innerHTML : '';
  if (waBtn) { waBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; waBtn.disabled = true; }

  try {
    const canvas = await captureResume();
    const name = document.getElementById('f-name').value.trim() || 'Resume';

    canvas.toBlob(async (blob) => {
      const file = new File([blob], `${name}_Resume.png`, { type: 'image/png' });

      // Native share (Android Chrome 75+, iOS Safari 15+)
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: `${name} - Resume`,
          text: `Resume via జన సేవా కేంద్రం 📄`,
        });
      } else {
        // Fallback: download image
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name}_Resume.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setTimeout(() => window.open(`https://wa.me/?text=${encodeURIComponent(name+' Resume via జన సేవా కేంద్రం')}`, '_blank'), 800);
      }

      if (waBtn) { waBtn.innerHTML = origHTML; waBtn.disabled = false; }
    }, 'image/png', 1.0);

  } catch(err) {
    if (err.name !== 'AbortError') {
      console.error(err);
      alert('Share error అయింది.');
    }
    if (waBtn) { waBtn.innerHTML = origHTML; waBtn.disabled = false; }
  }
}

// Init
if (window.innerWidth <= 768) {
  document.getElementById('mobile-tpl-bar').style.display = 'block';
}
addExp();
render();
</script>
