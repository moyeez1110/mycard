<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder – జన సేవా కేంద్రం</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#f0ede8;--panel:#fff;--border:#ddd9d0;--accent:#2d4a3e;--text:#1a1a1a;
  --muted:#6b6560;--light:#f7f5f2;--gold:#b5963e;--teal:#1D9E75;
  --font:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}

/* ── Header ── */
.header{background:var(--accent);padding:13px 20px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.logo{font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px}
.logo span{color:#a8d5b5;font-weight:400}
.hdr-right{display:flex;align-items:center;gap:10px}
.tpl-sel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:7px;padding:6px 10px;font-family:var(--font);font-size:12.5px;
  cursor:pointer;outline:none}
.tpl-sel option{color:#111;background:#fff}
.gen-btn{background:var(--gold);color:#fff;border:none;border-radius:8px;
  padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:var(--font);display:flex;align-items:center;gap:7px;transition:all .15s}
.gen-btn:hover:not(:disabled){background:#9a7d30;transform:translateY(-1px)}
.gen-btn:disabled{opacity:.55;cursor:not-allowed}

/* ── Form Layout ── */
.form-wrap{max-width:700px;margin:0 auto;padding:24px 16px 60px}

/* ── Tabs ── */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);
  border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tab{padding:10px 4px;font-size:11px;cursor:pointer;border:none;background:none;
  color:var(--muted);font-family:var(--font);text-align:center;
  border-bottom:2.5px solid transparent;transition:all .12s;font-weight:500}
.tab:hover{color:var(--text);background:var(--light)}
.tab.active{color:var(--accent);border-bottom:2.5px solid var(--accent);
  background:#fff;font-weight:700}

/* ── Section card ── */
.sec-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sec-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.sec-title i{font-size:13px;opacity:.7}

/* ── Fields ── */
.fl{font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:4px;
  display:block;text-transform:uppercase;letter-spacing:.06em}
.fi{width:100%;font-size:13.5px;padding:9px 12px;border:1.5px solid var(--border);
  border-radius:8px;background:#fff;color:var(--text);font-family:var(--font);
  margin-bottom:12px;transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,74,62,.08)}
textarea.fi{resize:vertical;line-height:1.55}
select.fi{cursor:pointer}
.fdiv{height:1px;background:var(--border);margin:10px 0 14px}
.iw{position:relative;margin-bottom:12px}
.iw .fi{padding-left:36px;margin-bottom:0}
.iw .ii{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:13px;color:var(--muted);pointer-events:none}
.iw .fi:focus~.ii,.iw .fi:not(:placeholder-shown)~.ii{color:var(--accent)}
.iw-ta{position:relative;margin-bottom:12px}
.iw-ta textarea{padding-left:36px;margin-bottom:0}
.iw-ta .ii{position:absolute;left:11px;top:13px;font-size:13px;
  color:var(--muted);pointer-events:none}

/* Two-col grid */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:520px){.two-col{grid-template-columns:1fr}}

/* ── Summary picker ── */
.sum-cat{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--gold);margin:10px 0 6px}
.sum-opt{display:block;padding:9px 11px;border:1.5px solid var(--border);
  border-radius:8px;cursor:pointer;margin-bottom:7px;transition:all .12s;background:#fff}
.sum-opt:hover{border-color:var(--accent);background:#f0f7f4}
.sum-opt.picked{border:2px solid var(--teal);background:#e8f7f2}
.so-title{font-size:12px;font-weight:600;color:var(--text)}
.so-preview{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.sum-opt.picked .so-title{color:var(--teal)}

/* ── Skill pills ── */
.skill-row{display:flex;gap:6px;margin-bottom:10px}
.skill-row .fi{margin-bottom:0;flex:1}
.sadd{padding:9px 12px;background:var(--accent);color:#fff;border:none;
  border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;
  font-family:var(--font);white-space:nowrap}
.sadd:hover{background:#1e3329}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pill{display:flex;align-items:center;gap:4px;font-size:11.5px;padding:4px 10px;
  border-radius:99px;background:#e8f7f2;color:var(--accent);font-weight:500;
  border:1px solid rgba(45,74,62,.2)}
.pill button{background:none;border:none;cursor:pointer;color:var(--accent);
  font-size:14px;line-height:1;padding:0;opacity:.6}
.pill button:hover{opacity:1}

/* ── Experience/Education cards ── */
.exp-card{background:var(--light);border:1px solid var(--border);
  border-radius:10px;padding:13px;margin-bottom:10px}
.exp-ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.exp-cl{font-size:12px;font-weight:600;color:var(--text)}
.exp-rem{background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:12px;padding:3px 8px;border-radius:5px;font-family:var(--font);transition:all .12s}
.exp-rem:hover{background:#fde8e8;color:#c0392b}
.add-exp{width:100%;padding:10px;border:1.5px dashed var(--border);background:none;
  border-radius:9px;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;
  font-family:var(--font);margin-bottom:10px;transition:all .15s}
.add-exp:hover{background:#f0f7f4;border-color:var(--accent)}

/* ── Strength chips ── */
.strength-chip{display:inline-block;font-size:11.5px;padding:4px 11px;
  border-radius:99px;cursor:pointer;border:1.5px solid var(--gold);
  color:var(--gold);background:transparent;margin:3px;transition:all .12s;font-family:var(--font)}
.strength-chip.on{background:var(--gold);color:#fff}

/* ── Status overlay ── */
#status-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px}
#status-overlay.show{display:flex}
.status-box{background:#111827;border:1px solid rgba(79,255,176,.2);
  border-radius:20px;padding:36px 32px;max-width:360px;width:92%;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.6);animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.status-icon{font-size:48px;margin-bottom:16px}
.status-title{font-size:18px;font-weight:700;color:#f0f4f8;margin-bottom:8px}
.status-msg{font-size:13px;color:#6b7a8d;line-height:1.6}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:48px;height:48px;border:4px solid rgba(79,255,176,.15);
  border-top-color:#4fffb0;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
.status-close{margin-top:20px;background:#1f2937;color:#94a3b8;border:1px solid rgba(255,255,255,.08);
  padding:10px 24px;border-radius:10px;font-size:13px;cursor:pointer;
  font-family:var(--font);font-weight:600;transition:background .2s}
.status-close:hover{background:#2d3f52}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="wallet.js"></script>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="header">
  <div class="logo">Resume<span>Builder</span></div>
  <div class="hdr-right">
    <select class="tpl-sel" id="tpl-select">
      <option value="classic">📄 Classic</option>
      <option value="modern">🎨 Modern</option>
      <option value="minimal">✨ Minimal</option>
      <option value="executive">👔 Executive</option>
    </select>
    <button class="gen-btn" id="gen-btn" onclick="generatePDF()">
      <i class="fa-solid fa-file-pdf"></i> Generate PDF
    </button>
  </div>
</div>

<!-- ══ STATUS OVERLAY ══ -->
<div id="status-overlay">
  <div class="status-box" id="status-box">
    <div class="spinner" id="st-spinner"></div>
    <div class="status-title" id="st-title">PDF Generate అవుతోంది...</div>
    <div class="status-msg" id="st-msg">మీ resume తయారవుతోంది. కొద్ది సెకన్లు వేచి ఉండండి.</div>
  </div>
</div>

<!-- ══ FORM ══ -->
<div class="form-wrap">

  <div class="tabs">
    <button class="tab active" onclick="showSec('info')" id="t-info">
      <i class="fa-solid fa-user"></i><br>Info
    </button>
    <button class="tab" onclick="showSec('bio')" id="t-bio">
      <i class="fa-solid fa-pen-nib"></i><br>Bio
    </button>
    <button class="tab" onclick="showSec('exp')" id="t-exp">
      <i class="fa-solid fa-briefcase"></i><br>Exp
    </button>
    <button class="tab" onclick="showSec('edu')" id="t-edu">
      <i class="fa-solid fa-graduation-cap"></i><br>Edu
    </button>
    <button class="tab" onclick="showSec('skills')" id="t-skills">
      <i class="fa-solid fa-layer-group"></i><br>Skills
    </button>
    <button class="tab" onclick="showSec('extra')" id="t-extra">
      <i class="fa-solid fa-ellipsis"></i><br>Extra
    </button>
  </div>

  <!-- INFO -->
  <div class="sec-card" id="sec-info">
    <div class="sec-title"><i class="fa-solid fa-id-card"></i> Personal Information</div>
    <div class="two-col">
      <div>
        <label class="fl">Full Name</label>
        <div class="iw"><input class="fi" id="f-name" placeholder="Arjun Reddy"><i class="ii fa-solid fa-user"></i></div>
      </div>
      <div>
        <label class="fl">Job Title</label>
        <div class="iw"><input class="fi" id="f-role" placeholder="Software Engineer"><i class="ii fa-solid fa-briefcase"></i></div>
      </div>
      <div>
        <label class="fl">Email</label>
        <div class="iw"><input class="fi" id="f-email" type="email" placeholder="you@email.com"><i class="ii fa-solid fa-envelope"></i></div>
      </div>
      <div>
        <label class="fl">Mobile</label>
        <div class="iw"><input class="fi" id="f-phone" type="tel" placeholder="+91 98765 43210"><i class="ii fa-solid fa-mobile-screen"></i></div>
      </div>
      <div>
        <label class="fl">City & Country</label>
        <div class="iw"><input class="fi" id="f-loc" placeholder="Hyderabad, India"><i class="ii fa-solid fa-location-dot"></i></div>
      </div>
      <div>
        <label class="fl">LinkedIn</label>
        <div class="iw"><input class="fi" id="f-linkedin" placeholder="linkedin.com/in/you"><i class="ii fa-brands fa-linkedin"></i></div>
      </div>
    </div>
    <label class="fl">Portfolio / Website</label>
    <div class="iw"><input class="fi" id="f-web" placeholder="yoursite.com"><i class="ii fa-solid fa-globe"></i></div>
  </div>

  <!-- BIO -->
  <div class="sec-card" id="sec-bio" style="display:none">
    <div class="sec-title"><i class="fa-solid fa-pen-nib"></i> Bio & Summary</div>
    <label class="fl">Choose a summary</label>
    <div id="sum-list"></div>
    <label class="fl" style="margin-top:6px">Or write your own</label>
    <textarea class="fi" id="f-summary" style="min-height:90px" placeholder="Type a custom summary..."></textarea>
    <label class="fl">Hobbies & Interests</label>
    <div class="iw"><input class="fi" id="f-hobbies" placeholder="Reading, Cricket, Blogging"><i class="ii fa-solid fa-heart"></i></div>
  </div>

  <!-- EXP -->
  <div class="sec-card" id="sec-exp" style="display:none">
    <div class="sec-title"><i class="fa-solid fa-briefcase"></i> Work Experience</div>
    <div id="exp-list"></div>
    <button class="add-exp" onclick="addExp()"><i class="fa-solid fa-plus"></i> Add Position</button>
  </div>

  <!-- EDU -->
  <div class="sec-card" id="sec-edu" style="display:none">
    <div class="sec-title"><i class="fa-solid fa-graduation-cap"></i> Education</div>
    <div id="edu-list"></div>
    <button class="add-exp" onclick="addEdu()"><i class="fa-solid fa-plus"></i> Add Qualification</button>
  </div>

  <!-- SKILLS -->
  <div class="sec-card" id="sec-skills" style="display:none">
    <div class="sec-title"><i class="fa-solid fa-layer-group"></i> Skills & Strengths</div>
    <label class="fl">Add from category</label>
    <div id="skill-cat-list"></div>
    <label class="fl" style="margin-top:8px">Or type your own skill</label>
    <div class="skill-row">
      <div class="iw" style="flex:1;margin-bottom:0">
        <input class="fi" id="skill-inp" placeholder="e.g. Python" onkeydown="if(event.key==='Enter')addSkill()">
        <i class="ii fa-solid fa-code"></i>
      </div>
      <button class="sadd" onclick="addSkill()">Add</button>
    </div>
    <div class="pills" id="skill-pills"></div>
    <label class="fl" style="margin-top:4px">Strengths</label>
    <div id="strength-list"></div>
    <label class="fl" style="margin-top:8px">Languages Known</label>
    <div class="iw"><input class="fi" id="f-langs" placeholder="English (Fluent), Telugu (Native)"><i class="ii fa-solid fa-language"></i></div>
    <label class="fl">Certifications</label>
    <div class="iw-ta">
      <textarea class="fi" id="f-certs" style="min-height:60px"
        placeholder="AWS Cloud Practitioner, 2024&#10;Google Digital Marketing, 2023"></textarea>
      <i class="ii fa-solid fa-certificate"></i>
    </div>
  </div>

  <!-- EXTRA -->
  <div class="sec-card" id="sec-extra" style="display:none">
    <div class="sec-title"><i class="fa-solid fa-ellipsis"></i> Personal Details & Declaration</div>
    <div class="two-col">
      <div>
        <label class="fl">Date of Birth</label>
        <div class="iw"><input class="fi" id="f-dob" placeholder="10 March 2002"><i class="ii fa-solid fa-cake-candles"></i></div>
      </div>
      <div>
        <label class="fl">Father's Name</label>
        <div class="iw"><input class="fi" id="f-father" placeholder="Mr. Krishna Reddy"><i class="ii fa-solid fa-person"></i></div>
      </div>
      <div>
        <label class="fl">Marital Status</label>
        <div class="iw">
          <select class="fi" id="f-marital" style="padding-left:36px">
            <option value="">Select...</option>
            <option>Single</option><option>Married</option>
            <option>Divorced</option><option>Widowed</option>
          </select>
          <i class="ii fa-solid fa-heart"></i>
        </div>
      </div>
      <div>
        <label class="fl">Nationality</label>
        <div class="iw"><input class="fi" id="f-nationality" placeholder="Indian"><i class="ii fa-solid fa-flag"></i></div>
      </div>
      <div>
        <label class="fl">Religion</label>
        <div class="iw"><input class="fi" id="f-religion" placeholder="Hindu"><i class="ii fa-solid fa-hands-praying"></i></div>
      </div>
    </div>
    <div class="fdiv"></div>
    <label class="fl">Declaration Text</label>
    <div class="iw-ta">
      <textarea class="fi" id="f-decl" style="min-height:72px">I hereby declare that all the information stated above is true and correct to the best of my knowledge and belief.</textarea>
      <i class="ii fa-solid fa-file-signature"></i>
    </div>
    <div class="two-col">
      <div>
        <label class="fl">Signature Name</label>
        <div class="iw"><input class="fi" id="f-signame" placeholder="Arjun Reddy"><i class="ii fa-solid fa-signature"></i></div>
      </div>
      <div>
        <label class="fl">Place</label>
        <div class="iw"><input class="fi" id="f-place" placeholder="Hyderabad"><i class="ii fa-solid fa-location-dot"></i></div>
      </div>
    </div>
    <label class="fl">Date</label>
    <div class="iw"><input class="fi" id="f-date" placeholder="17 May 2026"><i class="ii fa-solid fa-calendar-days"></i></div>
  </div>

</div><!-- /form-wrap -->

<script>
/* ══ CONFIG ══ */
const GAS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQgCCtcdcRdQYX3Zdhdc_BDmZPU2tw6tKUaUmuH8w_LobsbEOXq1LK0kbNSiPSNu0Lst1J_gKX-_GPl/pub?gid=1586432148&single=true&output=csv'; // ← Replace with your GAS Web App URL

/* ══ STATE ══ */
let skills=[], expBlocks=[], eduBlocks=[], pickedSum=null, strengths=[], skillCatOpen=null, expId=0, eduId=0;

/* ══ DATA ══ */
const SUMMARIES=[
  {cat:'Freshers / Entry Level',color:'#2d4a3e',items:[
    {label:'General Fresher',text:'Enthusiastic and detail-oriented recent graduate with a strong foundation in communication, teamwork, and problem-solving. A quick learner eager to contribute fresh perspectives and a strong work ethic to a forward-thinking organization.'},
    {label:'Tech / IT Fresher',text:'Motivated Computer Science graduate with solid knowledge of programming, data structures, and web technologies. Passionate about building efficient, user-friendly software and excited to grow within a dynamic engineering team.'},
    {label:'Commerce Fresher',text:'Commerce graduate with a strong grasp of financial principles, business communication, and data analysis. Ready to apply academic knowledge in a professional setting and contribute meaningfully to business operations.'},
  ]},
  {cat:'Experienced Professionals',color:'#1a2744',items:[
    {label:'Mid-Level Professional',text:'Results-driven professional with 4+ years of experience delivering high-quality outcomes in fast-paced environments. Proven track record of cross-functional collaboration, process improvement, and stakeholder management.'},
    {label:'Senior Tech Lead',text:'Senior software engineer with 8+ years of experience architecting scalable systems and mentoring engineering teams. Known for translating complex business requirements into robust technical solutions that drive measurable impact.'},
    {label:'Senior Manager',text:'Strategic and people-focused manager with 7+ years of experience leading cross-functional teams and driving organizational growth. Adept at aligning team objectives with company vision and delivering results under pressure.'},
  ]},
  {cat:'Career Changers',color:'#c0392b',items:[
    {label:'Returning to Workforce',text:'Motivated professional returning to the workforce after a career break, bringing refreshed focus, updated skills, and a strong commitment to contributing value. Eager to leverage diverse life experience in a new professional chapter.'},
    {label:'Career Switcher',text:'Ambitious professional transitioning into a new field, bringing transferable skills in communication, project management, and analytical thinking. Backed by recent upskilling and a genuine passion for this new direction.'},
  ]},
];

const SKILL_CATS=[
  {cat:'💻 Software / IT',color:'#1a2744',items:['Python','Java','JavaScript','React.js','Node.js','HTML/CSS','SQL','MongoDB','Git','Docker','AWS','REST APIs','TypeScript']},
  {cat:'📊 Data & Analytics',color:'#00695c',items:['Excel (Advanced)','Power BI','Tableau','SQL','Google Analytics','Data Visualisation','Statistics','R Programming','Machine Learning']},
  {cat:'🎨 Design / Creative',color:'#7b4fa6',items:['Figma','Adobe XD','Photoshop','Illustrator','UI/UX Design','Canva','Prototyping','Wireframing']},
  {cat:'📣 Marketing',color:'#c0392b',items:['SEO/SEM','Google Ads','Social Media Marketing','Content Writing','Email Marketing','HubSpot','Copywriting','Market Research']},
  {cat:'💼 Business / Finance',color:'#b5963e',items:['Financial Modelling','Budgeting','MS Excel','Tally ERP','SAP','Accounting','Auditing','Project Management','Business Analysis']},
  {cat:'👥 HR & People Ops',color:'#5c6bc0',items:['Recruitment','Talent Acquisition','Onboarding','HRIS (Workday)','Payroll Processing','Employee Relations','Training & Development']},
  {cat:'⚙️ Operations / Mgmt',color:'#2d4a3e',items:['Supply Chain','Inventory Management','Process Improvement','Lean / Six Sigma','Team Leadership','Vendor Management','Quality Control']},
];

const STRENGTHS=['Communication','Teamwork','Problem Solving','Leadership','Time Management',
  'Adaptability','Attention to Detail','Critical Thinking','Work Under Pressure','Initiative',
  'Creativity','Positive Attitude','Self-Motivation','Reliability','Quick Learner',
  'Decision Making','Analytical Thinking','Accountability','Organisation'];

/* ══ TAB SWITCH ══ */
function showSec(id){
  ['info','bio','exp','edu','skills','extra'].forEach(s=>{
    const el=document.getElementById('sec-'+s); if(el) el.style.display=(s===id?'block':'none');
    const t=document.getElementById('t-'+s);    if(t)  t.classList.toggle('active',s===id);
  });
  if(id==='bio')    buildSumList();
  if(id==='exp')    renderExpForms();
  if(id==='edu')    renderEduForms();
  if(id==='skills'){buildSkillCats();buildStrengthList();}
}

/* ══ SUMMARY ══ */
function buildSumList(){
  let h='';
  SUMMARIES.forEach((cat,ci)=>{
    h+=`<div class="sum-cat" style="color:${cat.color}">${cat.cat}</div>`;
    cat.items.forEach((item,ii)=>{
      const id=`s_${ci}_${ii}`;
      h+=`<div class="sum-opt${pickedSum===id?' picked':''}" onclick="pickSum('${id}','${item.text.replace(/'/g,"&#39;")}')">
        <div class="so-title">${item.label}</div>
        <div class="so-preview">${item.text.slice(0,80)}...</div>
      </div>`;
    });
  });
  document.getElementById('sum-list').innerHTML=h;
}
function pickSum(id,text){pickedSum=id;document.getElementById('f-summary').value=text;buildSumList();}

/* ══ SKILLS ══ */
function addSkill(){const inp=document.getElementById('skill-inp');const v=inp.value.trim();if(v&&!skills.includes(v)){skills.push(v);inp.value='';renderPills();}}
function removeSkill(s){skills=skills.filter(x=>x!==s);renderPills();}
function renderPills(){document.getElementById('skill-pills').innerHTML=skills.map(s=>`<span class="pill">${s}<button onclick="removeSkill('${s.replace(/'/g,"\\'")}')">×</button></span>`).join('');}
function buildSkillCats(){
  const el=document.getElementById('skill-cat-list');if(!el)return;
  el.innerHTML=SKILL_CATS.map((cat,ci)=>`<div style="margin-bottom:6px">
    <div onclick="toggleCat(${ci})" style="display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;background:${skillCatOpen===ci?'#f0f7f4':'#fff'}">
      <span style="font-size:12.5px;font-weight:500;color:${cat.color}">${cat.cat}</span>
      <i class="fa-solid fa-chevron-${skillCatOpen===ci?'up':'down'}" style="font-size:10px;color:var(--muted)"></i>
    </div>
    ${skillCatOpen===ci?`<div style="display:flex;flex-wrap:wrap;gap:5px;padding:9px 8px;border:1.5px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:#fafaf8">
      ${cat.items.map(s=>`<span onclick="toggleCatSkill('${s.replace(/'/g,"\\'")}',this)" style="font-size:11.5px;padding:4px 10px;border-radius:99px;cursor:pointer;border:1.5px solid ${cat.color};color:${skills.includes(s)?'#fff':cat.color};background:${skills.includes(s)?cat.color:'transparent'}">${s}</span>`).join('')}
    </div>`:''}
  </div>`).join('');
}
function toggleCat(ci){skillCatOpen=(skillCatOpen===ci?null:ci);buildSkillCats();}
function toggleCatSkill(s){if(skills.includes(s))skills=skills.filter(x=>x!==s);else skills.push(s);renderPills();buildSkillCats();}

/* ══ STRENGTHS ══ */
function buildStrengthList(){
  document.getElementById('strength-list').innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">
    ${STRENGTHS.map(s=>`<span class="strength-chip${strengths.includes(s)?' on':''}" onclick="toggleStrength('${s}')">${s}</span>`).join('')}
  </div>`;
}
function toggleStrength(s){if(strengths.includes(s))strengths=strengths.filter(x=>x!==s);else strengths.push(s);buildStrengthList();}

/* ══ EXPERIENCE ══ */
function gv(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function saveExpData(){expBlocks.forEach(b=>{
  b._title=gv(`et_${b.id}`)||b._title||'';b._company=gv(`ec_${b.id}`)||b._company||'';
  b._dur=gv(`ed_${b.id}`)||b._dur||'';b._loc=gv(`el_${b.id}`)||b._loc||'';
  b._desc=gv(`edesc_${b.id}`)||b._desc||'';
});}
function addExp(){saveExpData();expBlocks.push({id:++expId,_title:'',_company:'',_dur:'',_loc:'',_desc:''});renderExpForms();}
function removeExp(id){saveExpData();expBlocks=expBlocks.filter(b=>b.id!==id);renderExpForms();}
function renderExpForms(){
  const el=document.getElementById('exp-list');
  if(!expBlocks.length){el.innerHTML='<div style="text-align:center;padding:20px 0;color:#999;font-size:13px">No positions yet. Click <b>+ Add Position</b>.</div>';return;}
  el.innerHTML=expBlocks.map((b,i)=>`<div class="exp-card">
    <div class="exp-ch"><span class="exp-cl"><i class="fa-solid fa-briefcase" style="font-size:11px;margin-right:5px;opacity:.6"></i>Position ${i+1}</span>
    ${expBlocks.length>1?`<button class="exp-rem" onclick="saveExpData();removeExp(${b.id})">✕ Remove</button>`:''}</div>
    <div class="two-col">
      <div><label class="fl">Job Title</label><input class="fi" id="et_${b.id}" placeholder="Data Analyst" value="${esc(b._title)}"></div>
      <div><label class="fl">Company</label><input class="fi" id="ec_${b.id}" placeholder="Infosys" value="${esc(b._company)}"></div>
      <div><label class="fl">Duration</label><input class="fi" id="ed_${b.id}" placeholder="Jan 2022 – Mar 2024" value="${esc(b._dur)}"></div>
      <div><label class="fl">Location</label><input class="fi" id="el_${b.id}" placeholder="Hyderabad / Remote" value="${esc(b._loc)}"></div>
    </div>
    <label class="fl">Key Responsibilities</label>
    <textarea class="fi" id="edesc_${b.id}" style="min-height:68px" placeholder="• Led a team of 5&#10;• Improved efficiency by 30%">${esc(b._desc)}</textarea>
  </div>`).join('');
}

/* ══ EDUCATION ══ */
function saveEduData(){eduBlocks.forEach(b=>{
  b._deg=gv(`edeg_${b.id}`)||b._deg||'';b._uni=gv(`euni_${b.id}`)||b._uni||'';
  b._yr=gv(`eyr_${b.id}`)||b._yr||'';b._gpa=gv(`egpa_${b.id}`)||b._gpa||'';
  b._cw=gv(`ecw_${b.id}`)||b._cw||'';
});}
function addEdu(){saveEduData();eduBlocks.push({id:++eduId,_deg:'',_uni:'',_yr:'',_gpa:'',_cw:''});renderEduForms();}
function removeEdu(id){saveEduData();eduBlocks=eduBlocks.filter(b=>b.id!==id);renderEduForms();}
function renderEduForms(){
  const el=document.getElementById('edu-list');if(!el)return;
  if(!eduBlocks.length){el.innerHTML='<div style="text-align:center;padding:20px 0;color:#999;font-size:13px">No qualifications yet. Click <b>+ Add Qualification</b>.</div>';return;}
  el.innerHTML=eduBlocks.map((b,i)=>`<div class="exp-card">
    <div class="exp-ch"><span class="exp-cl"><i class="fa-solid fa-graduation-cap" style="font-size:11px;margin-right:5px;opacity:.6"></i>Qualification ${i+1}</span>
    ${eduBlocks.length>1?`<button class="exp-rem" onclick="saveEduData();removeEdu(${b.id})">✕ Remove</button>`:''}</div>
    <div class="two-col">
      <div><label class="fl">Degree / Qualification</label>
        <div class="iw"><input class="fi" id="edeg_${b.id}" placeholder="B.Tech / B.Com / MBA" value="${esc(b._deg)}"><i class="ii fa-solid fa-graduation-cap"></i></div></div>
      <div><label class="fl">Institution</label>
        <div class="iw"><input class="fi" id="euni_${b.id}" placeholder="Osmania University" value="${esc(b._uni)}"><i class="ii fa-solid fa-building-columns"></i></div></div>
      <div><label class="fl">Year</label>
        <div class="iw"><input class="fi" id="eyr_${b.id}" placeholder="2020 – 2024" value="${esc(b._yr)}"><i class="ii fa-solid fa-calendar"></i></div></div>
      <div><label class="fl">GPA / Percentage</label>
        <div class="iw"><input class="fi" id="egpa_${b.id}" placeholder="8.2 / 10" value="${esc(b._gpa)}"><i class="ii fa-solid fa-star"></i></div></div>
    </div>
    <label class="fl">Relevant Coursework</label>
    <textarea class="fi" id="ecw_${b.id}" style="min-height:48px" placeholder="Data Structures, DBMS...">${esc(b._cw)}</textarea>
  </div>`).join('');
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ══ COLLECT FORM DATA ══ */
function collectFormData(){
  saveExpData(); saveEduData();
  return {
    template: document.getElementById('tpl-select').value,
    name:     gv('f-name'),   role:    gv('f-role'),
    email:    gv('f-email'),  phone:   gv('f-phone'),
    location: gv('f-loc'),    linkedin:gv('f-linkedin'),
    website:  gv('f-web'),    summary: gv('f-summary'),
    hobbies:  gv('f-hobbies'),

      title:b._title,company:b._company,duration:b._dur,
      location:b._loc,description:b._desc
    })),
    education: eduBlocks.map(b=>({
      degree:b._deg,institution:b._uni,year:b._yr,
      gpa:b._gpa,coursework:b._cw
    })),
    skills:         [...skills],
    strengths:      [...strengths],
    languages:      gv('f-langs'),

    father:         gv('f-father'),
    marital:        gv('f-marital'),

    religion:       gv('f-religion'),
    declaration:    gv('f-decl'),

    place:          gv('f-place'),

  };
}

/* ══ STATUS HELPERS ══ */
function showStatus(type, title, msg){
  const ov=document.getElementById('status-overlay');
  const sp=document.getElementById('st-spinner');
  const ti=document.getElementById('st-title');
  const ms=document.getElementById('st-msg');
  const bx=document.getElementById('status-box');
  // Remove old close btn
  const old=bx.querySelector('.status-close');
  if(old) old.remove();
  const old2=bx.querySelector('.status-icon');
  if(old2) old2.remove();
  if(type==='loading'){
    sp.style.display='block'; ti.textContent=title; ms.textContent=msg;
  } else {
    sp.style.display='none';
    const ico=document.createElement('div');
    ico.className='status-icon';
    ico.textContent= type==='success'?'✅':'❌';
    bx.insertBefore(ico, ti);
    ti.textContent=title; ms.textContent=msg;
    const btn=document.createElement('button');
    btn.className='status-close';
    btn.textContent='Close';
    btn.onclick=()=>{ov.classList.remove('show');document.getElementById('gen-btn').disabled=false;};
    bx.appendChild(btn);
  }
  ov.classList.add('show');
}

/* ══ GENERATE PDF ══ */
async function generatePDF(){
  // Check token (set by wallet.js after verification)
  if(!window._svcToken){
    alert('⚠️ జన సేవా App నుండి access చేయండి.\nDirect access allowed కాదు.');
    return;
  }

  const data = collectFormData();
  if(!data.name){ alert('పేరు enter చేయండి.'); showSec('info'); return; }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  showStatus('loading','PDF Generate అవుతోంది...','మీ resume GAS server మీద build అవుతోంది. కొద్ది సెకన్లు వేచి ఉండండి.');

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // avoid CORS preflight
      body: JSON.stringify({ token: window._svcToken, data })
    });

    let result;
    try { result = await res.json(); }
    catch(e){ throw new Error('Server response invalid. GAS URL check చేయండి.'); }

    if(result.error) throw new Error(result.error);
    if(!result.pdf)  throw new Error('PDF data not received.');

    // Decode base64 and trigger download
    const binary = atob(result.pdf);
    const bytes  = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const blob   = new Blob([bytes],{type:'application/pdf'});
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href = url;
    a.download = (data.name||'Resume').replace(/\s+/g,'_')+'_Resume.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);

    // Consume token — one PDF per payment
    window._svcToken = null;

    showStatus('success','PDF Ready! 🎉',
      `"${data.name}_Resume.pdf" download అయింది. మీ resume professionally తయారైంది!`);

  } catch(err){
    console.error(err);
    showStatus('error','PDF Generate కాలేదు',
      err.message || 'Network error. Internet check చేసి మళ్ళీ try చేయండి.');
    btn.disabled = false;
  }
}

/* ── Init ── */
addExp(); addEdu();
