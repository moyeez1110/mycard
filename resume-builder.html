<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Fira+Mono:wght@400;500&family=Lato:wght@300;400;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#1a56db;
  --accent-light:#eff6ff;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
  --bg:#f8fafc;
  --white:#fff;
  --sidebar-bg:#1e293b;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* TOP NAV */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-0.5px}
.logo span{color:var(--text)}
.topbar-actions{display:flex;gap:8px}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1648c0}

/* LAYOUT */
.layout{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 56px)}

/* FORM PANEL */
.form-panel{background:var(--white);border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 56px)}
.form-tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);z-index:10}
.ftab{flex:1;padding:12px 8px;text-align:center;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.ftab.active{color:var(--accent);border-bottom-color:var(--accent)}
.form-section{display:none;padding:20px}
.form-section.active{display:block}
.field-group{margin-bottom:16px}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);transition:border .15s;outline:none}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
textarea.field-input{resize:vertical;min-height:80px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.add-btn{font-size:12px;color:var(--accent);cursor:pointer;font-weight:500;background:var(--accent-light);padding:4px 10px;border-radius:6px;border:none;font-family:'DM Sans',sans-serif}
.add-btn:hover{background:#dbeafe}
.card-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.remove-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;line-height:1}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.skill-tag{background:var(--accent-light);color:var(--accent);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px}
.skill-tag button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;line-height:1;padding:0}
.skill-input-row{display:flex;gap:6px}
.skill-input-row input{flex:1}
.photo-upload{width:80px;height:80px;border-radius:50%;background:var(--bg);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0}
.photo-upload img{width:100%;height:100%;object-fit:cover}
.photo-row{display:flex;align-items:center;gap:16px}
.photo-info{font-size:12px;color:var(--muted);line-height:1.6}

/* PREVIEW PANEL */
.preview-panel{background:#e2e8f0;padding:24px;overflow-y:auto;max-height:calc(100vh - 56px)}
.preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.preview-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.template-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tpl-btn{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--muted);transition:all .15s}
.tpl-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.resume-sheet{background:#fff;width:100%;max-width:680px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.12);border-radius:4px;min-height:900px}

/* ===== TEMPLATE: HARVARD (Classic) ===== */
.tpl-harvard .rv-head{text-align:center;padding:36px 40px 20px;border-bottom:2px solid #1e293b}
.tpl-harvard .rv-name{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#1e293b;letter-spacing:-0.5px}
.tpl-harvard .rv-title{font-size:13px;color:#64748b;margin-top:4px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.tpl-harvard .rv-contact{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:12px;color:#64748b;flex-wrap:wrap}
.tpl-harvard .rv-contact span::before{content:'• ';color:#94a3b8}
.tpl-harvard .rv-contact span:first-child::before{content:''}
.tpl-harvard .rv-body{padding:24px 40px}
.tpl-harvard .rv-section{margin-bottom:22px}
.tpl-harvard .rv-section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#1e293b;border-bottom:1.5px solid #1e293b;padding-bottom:4px;margin-bottom:12px}
.tpl-harvard .rv-item{margin-bottom:12px}
.tpl-harvard .rv-item-head{display:flex;justify-content:space-between;align-items:baseline}
.tpl-harvard .rv-item-title{font-weight:600;font-size:13px;color:#1e293b}
.tpl-harvard .rv-item-date{font-size:11px;color:#64748b}
.tpl-harvard .rv-item-sub{font-size:12px;color:#64748b;font-style:italic;margin-top:1px}
.tpl-harvard .rv-item-desc{font-size:12px;color:#374151;margin-top:5px;line-height:1.6}
.tpl-harvard .rv-skills-list{display:flex;flex-wrap:wrap;gap:6px}
.tpl-harvard .rv-skill{font-size:11px;color:#374151;background:#f1f5f9;padding:3px 8px;border-radius:4px}
.tpl-harvard .rv-summary{font-size:12.5px;color:#374151;line-height:1.7}

/* ===== TEMPLATE: MODERN ===== */
.tpl-modern .rv-head{background:linear-gradient(135deg,#1a56db 0%,#1e3a8a 100%);padding:36px 40px 28px;color:#fff;position:relative}
.tpl-modern .rv-name{font-family:'Raleway',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.5px}
.tpl-modern .rv-title{font-size:13px;margin-top:4px;opacity:.85;font-weight:400;letter-spacing:.5px}
.tpl-modern .rv-contact{display:flex;gap:20px;margin-top:14px;font-size:12px;opacity:.9;flex-wrap:wrap}
.tpl-modern .rv-contact span{display:flex;align-items:center;gap:4px}
.tpl-modern .rv-body{padding:28px 40px}
.tpl-modern .rv-section{margin-bottom:24px}
.tpl-modern .rv-section-title{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#1a56db;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tpl-modern .rv-section-title::after{content:'';flex:1;height:1px;background:#e2e8f0}
.tpl-modern .rv-item{margin-bottom:14px;padding-left:12px;border-left:2px solid #e2e8f0}
.tpl-modern .rv-item-head{display:flex;justify-content:space-between;align-items:baseline}
.tpl-modern .rv-item-title{font-weight:600;font-size:13px;color:#1e293b}
.tpl-modern .rv-item-date{font-size:11px;color:#64748b;background:#f1f5f9;padding:2px 7px;border-radius:10px}
.tpl-modern .rv-item-sub{font-size:12px;color:#64748b;margin-top:2px}
.tpl-modern .rv-item-desc{font-size:12px;color:#374151;margin-top:5px;line-height:1.6}
.tpl-modern .rv-skills-list{display:flex;flex-wrap:wrap;gap:6px}
.tpl-modern .rv-skill{font-size:11px;color:#fff;background:#1a56db;padding:4px 10px;border-radius:20px;font-weight:500}
.tpl-modern .rv-summary{font-size:12.5px;color:#374151;line-height:1.7}

/* ===== TEMPLATE: MINIMAL ===== */
.tpl-minimal .rv-head{padding:48px 48px 24px;border-bottom:1px solid #e2e8f0}
.tpl-minimal .rv-name{font-family:'Lato',sans-serif;font-size:32px;font-weight:300;color:#1e293b;letter-spacing:2px;text-transform:uppercase}
.tpl-minimal .rv-title{font-size:12px;color:#94a3b8;margin-top:6px;letter-spacing:2px;text-transform:uppercase}
.tpl-minimal .rv-contact{display:flex;gap:20px;margin-top:12px;font-size:11px;color:#94a3b8;flex-wrap:wrap;letter-spacing:.5px}
.tpl-minimal .rv-body{padding:28px 48px}
.tpl-minimal .rv-section{margin-bottom:28px;display:grid;grid-template-columns:120px 1fr;gap:16px}
.tpl-minimal .rv-section-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#94a3b8;padding-top:2px}
.tpl-minimal .rv-section-content{border-left:1px solid #e2e8f0;padding-left:20px}
.tpl-minimal .rv-item{margin-bottom:14px}
.tpl-minimal .rv-item-head{display:flex;justify-content:space-between;align-items:baseline}
.tpl-minimal .rv-item-title{font-weight:600;font-size:13px;color:#1e293b}
.tpl-minimal .rv-item-date{font-size:11px;color:#94a3b8}
.tpl-minimal .rv-item-sub{font-size:12px;color:#94a3b8;margin-top:1px}
.tpl-minimal .rv-item-desc{font-size:12px;color:#374151;margin-top:4px;line-height:1.6}
.tpl-minimal .rv-skills-list{display:flex;flex-wrap:wrap;gap:6px}
.tpl-minimal .rv-skill{font-size:11px;color:#64748b;border:1px solid #e2e8f0;padding:3px 8px;border-radius:4px}
.tpl-minimal .rv-summary{font-size:12.5px;color:#374151;line-height:1.7}

/* ===== TEMPLATE: SIDEBAR ===== */
.tpl-sidebar .rv-wrapper{display:grid;grid-template-columns:220px 1fr;min-height:900px}
.tpl-sidebar .rv-sidebar{background:#1e293b;padding:32px 20px;color:#fff}
.tpl-sidebar .rv-photo{width:80px;height:80px;border-radius:50%;background:#334155;margin:0 auto 16px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#94a3b8}
.tpl-sidebar .rv-photo img{width:100%;height:100%;object-fit:cover}
.tpl-sidebar .rv-name{font-family:'Raleway',sans-serif;font-size:18px;font-weight:700;color:#fff;text-align:center;line-height:1.3}
.tpl-sidebar .rv-title{font-size:11px;color:#94a3b8;text-align:center;margin-top:4px;letter-spacing:.5px}
.tpl-sidebar .rv-sb-section{margin-top:24px}
.tpl-sidebar .rv-sb-section-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#64748b;margin-bottom:10px}
.tpl-sidebar .rv-sb-item{font-size:11px;color:#cbd5e1;margin-bottom:6px;word-break:break-word}
.tpl-sidebar .rv-sb-skill{font-size:11px;color:#cbd5e1;margin-bottom:6px}
.tpl-sidebar .rv-sb-bar{height:3px;background:#334155;border-radius:2px;margin-top:3px;margin-bottom:8px}
.tpl-sidebar .rv-sb-bar-fill{height:100%;background:#3b82f6;border-radius:2px}
.tpl-sidebar .rv-main{padding:32px 28px}
.tpl-sidebar .rv-section{margin-bottom:22px}
.tpl-sidebar .rv-section-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#1a56db;border-bottom:2px solid #1a56db;padding-bottom:5px;margin-bottom:12px}
.tpl-sidebar .rv-item{margin-bottom:12px}
.tpl-sidebar .rv-item-head{display:flex;justify-content:space-between;align-items:baseline}
.tpl-sidebar .rv-item-title{font-weight:600;font-size:13px;color:#1e293b}
.tpl-sidebar .rv-item-date{font-size:11px;color:#64748b}
.tpl-sidebar .rv-item-sub{font-size:12px;color:#64748b;margin-top:1px}
.tpl-sidebar .rv-item-desc{font-size:12px;color:#374151;margin-top:4px;line-height:1.6}
.tpl-sidebar .rv-summary{font-size:12.5px;color:#374151;line-height:1.7}

/* ===== TEMPLATE: EXECUTIVE ===== */
.tpl-executive .rv-head{padding:40px 48px 28px;background:#0f172a}
.tpl-executive .rv-name{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:#fff;letter-spacing:-1px}
.tpl-executive .rv-title{font-size:13px;color:#f59e0b;margin-top:6px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.tpl-executive .rv-contact{display:flex;gap:20px;margin-top:14px;font-size:12px;color:#94a3b8;flex-wrap:wrap}
.tpl-executive .rv-body{padding:28px 48px}
.tpl-executive .rv-section{margin-bottom:24px}
.tpl-executive .rv-section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#f59e0b;margin-bottom:12px}
.tpl-executive .rv-item{margin-bottom:14px;position:relative;padding-left:14px}
.tpl-executive .rv-item::before{content:'';position:absolute;left:0;top:5px;width:5px;height:5px;border-radius:50%;background:#f59e0b}
.tpl-executive .rv-item-head{display:flex;justify-content:space-between;align-items:baseline}
.tpl-executive .rv-item-title{font-weight:700;font-size:13px;color:#1e293b}
.tpl-executive .rv-item-date{font-size:11px;color:#64748b}
.tpl-executive .rv-item-sub{font-size:12px;color:#64748b;margin-top:1px}
.tpl-executive .rv-item-desc{font-size:12px;color:#374151;margin-top:4px;line-height:1.6}
.tpl-executive .rv-skills-list{display:flex;flex-wrap:wrap;gap:6px}
.tpl-executive .rv-skill{font-size:11px;color:#0f172a;background:#fef3c7;border:1px solid #f59e0b;padding:3px 10px;border-radius:4px;font-weight:500}
.tpl-executive .rv-summary{font-size:12.5px;color:#374151;line-height:1.7}

/* Print */
@media print{
  .topbar,.form-panel,.preview-header,.template-bar,.topbar-actions{display:none!important}
  .layout{grid-template-columns:1fr}
  .preview-panel{background:#fff;padding:0;max-height:none}
  .resume-sheet{box-shadow:none;max-width:100%}
}

/* Responsive */
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .form-panel{max-height:none}
  .preview-panel{padding:16px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Resume<span>Craft</span></div>
  <div class="topbar-actions">
    <button class="btn btn-outline" onclick="window.print()">🖨 Print</button>
    <button class="btn btn-primary" onclick="downloadPDF()">⬇ Download PDF</button>
  </div>
</div>

<div class="layout">
  <!-- FORM PANEL -->
  <div class="form-panel">
    <div class="form-tabs">
      <div class="ftab active" onclick="switchTab('basics',this)">Basics</div>
      <div class="ftab" onclick="switchTab('experience',this)">Experience</div>
      <div class="ftab" onclick="switchTab('education',this)">Education</div>
      <div class="ftab" onclick="switchTab('skills',this)">Skills</div>
    </div>

    <!-- BASICS -->
    <div class="form-section active" id="tab-basics">
      <div class="section-title">Personal Info</div>

      <div class="photo-row" style="margin-bottom:20px">
        <label class="photo-upload" id="photo-label" title="Upload Photo">
          <img id="photo-preview" src="" alt="" style="display:none">
          <span id="photo-icon" style="font-size:28px">👤</span>
          <input type="file" accept="image/*" style="display:none" onchange="handlePhoto(this)">
        </label>
        <div class="photo-info">
          <strong style="font-size:13px">Profile Photo</strong><br>
          Click to upload (optional)<br>
          JPG or PNG, max 2MB
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">Full Name</div>
        <input class="field-input" type="text" id="f-name" placeholder="e.g. Rajesh Kumar" oninput="update()">
      </div>
      <div class="field-group">
        <div class="field-label">Job Title / Role</div>
        <input class="field-input" type="text" id="f-title" placeholder="e.g. Senior Software Engineer" oninput="update()">
      </div>
      <div class="two-col">
        <div class="field-group">
          <div class="field-label">Phone</div>
          <input class="field-input" type="text" id="f-phone" placeholder="+91 98765 43210" oninput="update()">
        </div>
        <div class="field-group">
          <div class="field-label">Email</div>
          <input class="field-input" type="email" id="f-email" placeholder="you@email.com" oninput="update()">
        </div>
      </div>
      <div class="two-col">
        <div class="field-group">
          <div class="field-label">Location</div>
          <input class="field-input" type="text" id="f-location" placeholder="Hyderabad, India" oninput="update()">
        </div>
        <div class="field-group">
          <div class="field-label">LinkedIn / Website</div>
          <input class="field-input" type="text" id="f-linkedin" placeholder="linkedin.com/in/you" oninput="update()">
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Professional Summary</div>
        <textarea class="field-input" id="f-summary" rows="4" placeholder="Brief summary of your professional background, key skills, and career goals..." oninput="update()"></textarea>
      </div>
    </div>

    <!-- EXPERIENCE -->
    <div class="form-section" id="tab-experience">
      <div class="section-title">
        Work Experience
        <button class="add-btn" onclick="addExperience()">+ Add</button>
      </div>
      <div id="exp-list"></div>
    </div>

    <!-- EDUCATION -->
    <div class="form-section" id="tab-education">
      <div class="section-title">
        Education
        <button class="add-btn" onclick="addEducation()">+ Add</button>
      </div>
      <div id="edu-list"></div>
    </div>

    <!-- SKILLS -->
    <div class="form-section" id="tab-skills">
      <div class="section-title">Skills</div>
      <div class="field-group">
        <div class="field-label">Add a Skill</div>
        <div class="skill-input-row">
          <input class="field-input" type="text" id="skill-input" placeholder="e.g. Python, Project Management..." onkeydown="if(event.key==='Enter')addSkill()">
          <button class="btn btn-primary" onclick="addSkill()">Add</button>
        </div>
        <div class="skill-tags" id="skill-list"></div>
      </div>

      <div class="section-title" style="margin-top:20px">Languages</div>
      <div class="field-group">
        <div class="field-label">Add a Language</div>
        <div class="skill-input-row">
          <input class="field-input" type="text" id="lang-input" placeholder="e.g. English (Fluent), Telugu..." onkeydown="if(event.key==='Enter')addLang()">
          <button class="btn btn-primary" onclick="addLang()">Add</button>
        </div>
        <div class="skill-tags" id="lang-list"></div>
      </div>
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="preview-panel">
    <div class="preview-header">
      <span class="preview-label">Live Preview</span>
    </div>
    <div class="template-bar">
      <button class="tpl-btn active" onclick="setTemplate('harvard',this)">Harvard</button>
      <button class="tpl-btn" onclick="setTemplate('modern',this)">Modern</button>
      <button class="tpl-btn" onclick="setTemplate('minimal',this)">Minimal</button>
      <button class="tpl-btn" onclick="setTemplate('sidebar',this)">Sidebar</button>
      <button class="tpl-btn" onclick="setTemplate('executive',this)">Executive</button>
    </div>
    <div class="resume-sheet" id="resume-sheet">
      <!-- Rendered by JS -->
    </div>
  </div>
</div>

<script>
let template = 'harvard';
let skills = [];
let langs = [];
let experiences = [];
let educations = [];
let photoDataUrl = '';
let expCounter = 0;
let eduCounter = 0;

function switchTab(name, el) {
  document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
}

function setTemplate(t, el) {
  template = t;
  document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  update();
}

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    photoDataUrl = e.target.result;
    document.getElementById('photo-preview').src = photoDataUrl;
    document.getElementById('photo-preview').style.display = 'block';
    document.getElementById('photo-icon').style.display = 'none';
    update();
  };
  reader.readAsDataURL(file);
}

function addExperience() {
  const id = ++expCounter;
  experiences.push({id, company:'', role:'', start:'', end:'', desc:''});
  renderExpList();
  update();
}

function removeExperience(id) {
  experiences = experiences.filter(e => e.id !== id);
  renderExpList();
  update();
}

function renderExpList() {
  const list = document.getElementById('exp-list');
  list.innerHTML = experiences.map(ex => `
    <div class="card-item">
      <button class="remove-btn" onclick="removeExperience(${ex.id})">×</button>
      <div class="field-group">
        <div class="field-label">Company</div>
        <input class="field-input" type="text" value="${ex.company}" placeholder="Company Name" oninput="updateExp(${ex.id},'company',this.value)">
      </div>
      <div class="field-group">
        <div class="field-label">Role / Title</div>
        <input class="field-input" type="text" value="${ex.role}" placeholder="Job Title" oninput="updateExp(${ex.id},'role',this.value)">
      </div>
      <div class="two-col">
        <div class="field-group">
          <div class="field-label">Start</div>
          <input class="field-input" type="text" value="${ex.start}" placeholder="Jan 2022" oninput="updateExp(${ex.id},'start',this.value)">
        </div>
        <div class="field-group">
          <div class="field-label">End</div>
          <input class="field-input" type="text" value="${ex.end}" placeholder="Present" oninput="updateExp(${ex.id},'end',this.value)">
        </div>
      </div>
      <div class="field-group">
        <div class="field-label">Description</div>
        <textarea class="field-input" rows="3" placeholder="Describe your responsibilities and achievements..." oninput="updateExp(${ex.id},'desc',this.value)">${ex.desc}</textarea>
      </div>
    </div>
  `).join('');
}

function updateExp(id, field, val) {
  const ex = experiences.find(e => e.id === id);
  if (ex) { ex[field] = val; update(); }
}

function addEducation() {
  const id = ++eduCounter;
  educations.push({id, school:'', degree:'', year:'', gpa:''});
  renderEduList();
  update();
}

function removeEducation(id) {
  educations = educations.filter(e => e.id !== id);
  renderEduList();
  update();
}

function renderEduList() {
  const list = document.getElementById('edu-list');
  list.innerHTML = educations.map(ed => `
    <div class="card-item">
      <button class="remove-btn" onclick="removeEducation(${ed.id})">×</button>
      <div class="field-group">
        <div class="field-label">School / University</div>
        <input class="field-input" type="text" value="${ed.school}" placeholder="University Name" oninput="updateEdu(${ed.id},'school',this.value)">
      </div>
      <div class="field-group">
        <div class="field-label">Degree / Field</div>
        <input class="field-input" type="text" value="${ed.degree}" placeholder="B.Tech Computer Science" oninput="updateEdu(${ed.id},'degree',this.value)">
      </div>
      <div class="two-col">
        <div class="field-group">
          <div class="field-label">Year</div>
          <input class="field-input" type="text" value="${ed.year}" placeholder="2018 – 2022" oninput="updateEdu(${ed.id},'year',this.value)">
        </div>
        <div class="field-group">
          <div class="field-label">GPA / Grade</div>
          <input class="field-input" type="text" value="${ed.gpa}" placeholder="8.5 / 10" oninput="updateEdu(${ed.id},'gpa',this.value)">
        </div>
      </div>
    </div>
  `).join('');
}

function updateEdu(id, field, val) {
  const ed = educations.find(e => e.id === id);
  if (ed) { ed[field] = val; update(); }
}

function addSkill() {
  const inp = document.getElementById('skill-input');
  const val = inp.value.trim();
  if (!val || skills.includes(val)) return;
  skills.push(val); inp.value = '';
  renderSkillTags();
  update();
}

function removeSkill(s) {
  skills = skills.filter(x => x !== s);
  renderSkillTags();
  update();
}

function renderSkillTags() {
  document.getElementById('skill-list').innerHTML = skills.map(s =>
    `<div class="skill-tag">${s}<button onclick="removeSkill('${s}')">×</button></div>`
  ).join('');
}

function addLang() {
  const inp = document.getElementById('lang-input');
  const val = inp.value.trim();
  if (!val || langs.includes(val)) return;
  langs.push(val); inp.value = '';
  renderLangTags();
  update();
}

function removeLang(l) {
  langs = langs.filter(x => x !== l);
  renderLangTags();
  update();
}

function renderLangTags() {
  document.getElementById('lang-list').innerHTML = langs.map(l =>
    `<div class="skill-tag">${l}<button onclick="removeLang('${l}')">×</button></div>`
  ).join('');
}

function g(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function initials(name) {
  return name.split(' ').map(n=>n[0]||'').join('').toUpperCase().slice(0,2) || 'CV';
}

function buildContact(classes) {
  const items = [];
  const phone = g('f-phone'), email = g('f-email'), loc = g('f-location'), li = g('f-linkedin');
  if (phone) items.push(`<span>${esc(phone)}</span>`);
  if (email) items.push(`<span>${esc(email)}</span>`);
  if (loc) items.push(`<span>${esc(loc)}</span>`);
  if (li) items.push(`<span>${esc(li)}</span>`);
  return `<div class="rv-contact">${items.join('')}</div>`;
}

function buildExperience(tplClass) {
  if (!experiences.length) return '';
  const items = experiences.map(ex => `
    <div class="rv-item">
      <div class="rv-item-head">
        <div class="rv-item-title">${esc(ex.role)}</div>
        <div class="rv-item-date">${esc(ex.start)}${ex.start&&ex.end?' – ':''}${esc(ex.end)}</div>
      </div>
      <div class="rv-item-sub">${esc(ex.company)}</div>
      ${ex.desc ? `<div class="rv-item-desc">${esc(ex.desc)}</div>` : ''}
    </div>
  `).join('');
  return items;
}

function buildEducation() {
  if (!educations.length) return '';
  return educations.map(ed => `
    <div class="rv-item">
      <div class="rv-item-head">
        <div class="rv-item-title">${esc(ed.degree)}</div>
        <div class="rv-item-date">${esc(ed.year)}</div>
      </div>
      <div class="rv-item-sub">${esc(ed.school)}${ed.gpa ? ' · ' + esc(ed.gpa) : ''}</div>
    </div>
  `).join('');
}

function buildSkills(cls) {
  if (!skills.length && !langs.length) return '';
  const skillHtml = skills.map(s => `<span class="rv-skill">${esc(s)}</span>`).join('');
  const langHtml = langs.map(l => `<span class="rv-skill">${esc(l)}</span>`).join('');
  let html = '';
  if (skills.length) html += `<div class="rv-skills-list">${skillHtml}</div>`;
  if (langs.length) html += `<div style="margin-top:8px"><div style="font-size:11px;color:#94a3b8;margin-bottom:6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase">Languages</div><div class="rv-skills-list">${langHtml}</div></div>`;
  return html;
}

function renderHarvard() {
  const name = g('f-name') || 'Your Name';
  const title = g('f-title');
  const summary = g('f-summary');
  const expHtml = buildExperience('tpl-harvard');
  const eduHtml = buildEducation();
  const skillHtml = buildSkills('tpl-harvard');
  return `<div class="tpl-harvard">
    <div class="rv-head">
      <div class="rv-name">${esc(name)}</div>
      ${title ? `<div class="rv-title">${esc(title)}</div>` : ''}
      ${buildContact()}
    </div>
    <div class="rv-body">
      ${summary ? `<div class="rv-section"><div class="rv-section-title">Professional Summary</div><div class="rv-summary">${esc(summary)}</div></div>` : ''}
      ${expHtml ? `<div class="rv-section"><div class="rv-section-title">Experience</div>${expHtml}</div>` : ''}
      ${eduHtml ? `<div class="rv-section"><div class="rv-section-title">Education</div>${eduHtml}</div>` : ''}
      ${skillHtml ? `<div class="rv-section"><div class="rv-section-title">Skills & Languages</div>${skillHtml}</div>` : ''}
    </div>
  </div>`;
}

function renderModern() {
  const name = g('f-name') || 'Your Name';
  const title = g('f-title');
  const summary = g('f-summary');
  const expHtml = buildExperience('tpl-modern');
  const eduHtml = buildEducation();
  const skillHtml = buildSkills('tpl-modern');
  return `<div class="tpl-modern">
    <div class="rv-head">
      <div class="rv-name">${esc(name)}</div>
      ${title ? `<div class="rv-title">${esc(title)}</div>` : ''}
      ${buildContact()}
    </div>
    <div class="rv-body">
      ${summary ? `<div class="rv-section"><div class="rv-section-title">About Me</div><div class="rv-summary">${esc(summary)}</div></div>` : ''}
      ${expHtml ? `<div class="rv-section"><div class="rv-section-title">Experience</div>${expHtml}</div>` : ''}
      ${eduHtml ? `<div class="rv-section"><div class="rv-section-title">Education</div>${eduHtml}</div>` : ''}
      ${skillHtml ? `<div class="rv-section"><div class="rv-section-title">Skills & Languages</div>${skillHtml}</div>` : ''}
    </div>
  </div>`;
}

function renderMinimal() {
  const name = g('f-name') || 'Your Name';
  const title = g('f-title');
  const summary = g('f-summary');
  const expHtml = buildExperience('tpl-minimal');
  const eduHtml = buildEducation();
  const skillHtml = buildSkills('tpl-minimal');
  const section = (label, content) => content ? `
    <div class="rv-section">
      <div class="rv-section-title">${label}</div>
      <div class="rv-section-content">${content}</div>
    </div>` : '';
  return `<div class="tpl-minimal">
    <div class="rv-head">
      <div class="rv-name">${esc(name)}</div>
      ${title ? `<div class="rv-title">${esc(title)}</div>` : ''}
      ${buildContact()}
    </div>
    <div class="rv-body">
      ${section('Profile', summary ? `<div class="rv-summary">${esc(summary)}</div>` : '')}
      ${section('Experience', expHtml)}
      ${section('Education', eduHtml)}
      ${section('Skills', skillHtml)}
    </div>
  </div>`;
}

function renderSidebar() {
  const name = g('f-name') || 'Your Name';
  const title = g('f-title');
  const summary = g('f-summary');
  const phone = g('f-phone'), email = g('f-email'), loc = g('f-location'), li = g('f-linkedin');
  const expHtml = buildExperience('tpl-sidebar');
  const eduHtml = buildEducation();
  const photoHtml = photoDataUrl
    ? `<div class="rv-photo"><img src="${photoDataUrl}"></div>`
    : `<div class="rv-photo">${initials(name)}</div>`;
  const contactItems = [
    phone ? `<div class="rv-sb-item">📞 ${esc(phone)}</div>` : '',
    email ? `<div class="rv-sb-item">✉ ${esc(email)}</div>` : '',
    loc ? `<div class="rv-sb-item">📍 ${esc(loc)}</div>` : '',
    li ? `<div class="rv-sb-item">🔗 ${esc(li)}</div>` : '',
  ].filter(Boolean).join('');
  const skillsHtml = skills.map(s => `<div class="rv-sb-skill">${esc(s)}<div class="rv-sb-bar"><div class="rv-sb-bar-fill" style="width:${75+Math.random()*20|0}%"></div></div></div>`).join('');
  const langsHtml = langs.map(l => `<div class="rv-sb-skill">${esc(l)}</div>`).join('');
  return `<div class="tpl-sidebar">
    <div class="rv-wrapper">
      <div class="rv-sidebar">
        ${photoHtml}
        <div class="rv-name">${esc(name)}</div>
        ${title ? `<div class="rv-title">${esc(title)}</div>` : ''}
        ${contactItems ? `<div class="rv-sb-section"><div class="rv-sb-section-title">Contact</div>${contactItems}</div>` : ''}
        ${skillsHtml ? `<div class="rv-sb-section"><div class="rv-sb-section-title">Skills</div>${skillsHtml}</div>` : ''}
        ${langsHtml ? `<div class="rv-sb-section"><div class="rv-sb-section-title">Languages</div>${langsHtml}</div>` : ''}
      </div>
      <div class="rv-main">
        ${summary ? `<div class="rv-section"><div class="rv-section-title">About</div><div class="rv-summary">${esc(summary)}</div></div>` : ''}
        ${expHtml ? `<div class="rv-section"><div class="rv-section-title">Experience</div>${expHtml}</div>` : ''}
        ${eduHtml ? `<div class="rv-section"><div class="rv-section-title">Education</div>${eduHtml}</div>` : ''}
      </div>
    </div>
  </div>`;
}

function renderExecutive() {
  const name = g('f-name') || 'Your Name';
  const title = g('f-title');
  const summary = g('f-summary');
  const expHtml = buildExperience('tpl-executive');
  const eduHtml = buildEducation();
  const skillHtml = buildSkills('tpl-executive');
  return `<div class="tpl-executive">
    <div class="rv-head">
      <div class="rv-name">${esc(name)}</div>
      ${title ? `<div class="rv-title">${esc(title)}</div>` : ''}
      ${buildContact()}
    </div>
    <div class="rv-body">
      ${summary ? `<div class="rv-section"><div class="rv-section-title">Executive Summary</div><div class="rv-summary">${esc(summary)}</div></div>` : ''}
      ${expHtml ? `<div class="rv-section"><div class="rv-section-title">Professional Experience</div>${expHtml}</div>` : ''}
      ${eduHtml ? `<div class="rv-section"><div class="rv-section-title">Education</div>${eduHtml}</div>` : ''}
      ${skillHtml ? `<div class="rv-section"><div class="rv-section-title">Core Competencies</div>${skillHtml}</div>` : ''}
    </div>
  </div>`;
}

function update() {
  const sheet = document.getElementById('resume-sheet');
  const renders = {
    harvard: renderHarvard,
    modern: renderModern,
    minimal: renderMinimal,
    sidebar: renderSidebar,
    executive: renderExecutive
  };
  sheet.innerHTML = (renders[template] || renderHarvard)();
}

function downloadPDF() {
  const style = document.createElement('style');
  style.textContent = `@media print{body>*:not(.resume-sheet){display:none!important}.resume-sheet{box-shadow:none!important;max-width:100%!important}}`;
  document.head.appendChild(style);
  window.print();
  document.head.removeChild(style);
}
