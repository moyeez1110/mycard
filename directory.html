<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Find an Agent Near You — Citizen Digital Seva</title>
<link rel="icon" href="/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --accent:#4fffb0; --accent-dim:#1adb7a;
    --bg:#0a0f1a; --bg2:#111827; --bg3:#1a2235; --card:#141e2e;
    --border:rgba(255,255,255,0.08);
    --text:#e8edf5; --text2:#8899aa;
    --font-te:'Noto Sans Telugu',sans-serif; --font:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-te),var(--font);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  .hero{background:linear-gradient(135deg,var(--bg2),#0d1420);padding:36px 16px 26px;text-align:center;border-bottom:1px solid var(--border)}
  .hero h1{font-size:22px;font-weight:800}
  .hero p{font-size:13px;color:var(--text2);margin-top:6px}
  .filters{max-width:1100px;margin:-22px auto 0;padding:0 16px;position:relative;z-index:5}
  .filter-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;gap:10px;flex-wrap:wrap}
  .filter-card input, .filter-card select{flex:1;min-width:140px;background:var(--bg3);border:1px solid var(--border);
    color:var(--text);padding:10px 12px;border-radius:10px;font-size:13px;font-family:var(--font-te),var(--font)}
  .filter-card button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:600}
  .results-bar{max-width:1100px;margin:22px auto 12px;padding:0 16px;font-size:12.5px;color:var(--text2)}
  .grid{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .agent-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-decoration:none;color:var(--text);
    display:flex;flex-direction:column;gap:8px;transition:transform .15s}
  .agent-card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .ac-top{display:flex;gap:12px;align-items:center}
  .ac-photo{width:52px;height:52px;border-radius:14px;background:var(--bg3);border:2px solid var(--accent);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:18px;overflow:hidden}
  .ac-photo img{width:100%;height:100%;object-fit:cover}
  .ac-name{font-size:14.5px;font-weight:700;line-height:1.25}
  .ac-agentname{font-size:11.5px;color:var(--text2)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;background:rgba(79,255,176,0.12);
    color:var(--accent);padding:2px 8px;border-radius:10px;margin-top:3px;width:fit-content}
  .ac-intro{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ac-meta{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text2)}
  .ac-meta i{width:14px;color:var(--accent);margin-right:4px}
  .ac-rating{font-size:12px;color:#f0b429;font-weight:600}
  .ac-btn{margin-top:4px;text-align:center;background:var(--accent);color:#0a0f1a;font-weight:700;padding:8px;border-radius:10px;font-size:12.5px}
  .empty{text-align:center;color:var(--text2);font-size:13px;padding:60px 0;grid-column:1/-1}
  .loading{display:flex;align-items:center;justify-content:center;min-height:50vh;font-size:13px;color:var(--text2)}
</style>
</head>
<body>

<div class="hero">
  <h1>📍 Find an Agent Near You</h1>
  <p>Search agents, shops & services in your area</p>
</div>

<div class="filters">
  <div class="filter-card">
    <input id="f-search" type="text" placeholder="🔍 Agent / Shop పేరు వెతకండి…" oninput="applyFilters()"/>
    <select id="f-city" onchange="applyFilters()"><option value="">అన్ని జిల్లాలు/ఊర్లు</option></select>
    <button onclick="clearFilters()"><i class="fas fa-rotate-left"></i> Clear</button>
  </div>
</div>

<div class="results-bar" id="results-bar"></div>
<div id="loading" class="loading">లోడ్ అవుతోంది…</div>
<div class="grid" id="agent-grid"></div>

<script>
const SUPABASE_URL = 'https://pusmroyftjzdkcwuwsph.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1c21yb3lmdGp6ZGtjd3V3c3BoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNTIzNjcsImV4cCI6MjEwMDYyODM2N30.FTL-p8QLjcdErof1-Usolqudh1aUoKkKBw1UkvrkMNI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ALL_AGENTS = [];
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadDirectory() {
  const today = new Date().toISOString().slice(0,10);
  // Automatic listing: only agents with an active, non-expired subscription
  const { data: agents, error } = await sb
    .from('agents')
    .select('*')
    .eq('is_active', true)
    .gte('subscription_end', today);

  document.getElementById('loading').style.display = 'none';
  if (error) { document.getElementById('agent-grid').innerHTML = '<div class="empty">Load failed: '+error.message+'</div>'; return; }

  // Ratings (average per agent) — fetched separately, lightweight
  const { data: reviews } = await sb.from('agent_reviews').select('agent_id, rating');
  const ratingMap = {};
  (reviews || []).forEach(r => {
    if (!ratingMap[r.agent_id]) ratingMap[r.agent_id] = { sum: 0, count: 0 };
    ratingMap[r.agent_id].sum += r.rating; ratingMap[r.agent_id].count++;
  });

  ALL_AGENTS = (agents || []).map(a => ({
    ...a,
    avgRating: ratingMap[a.id] ? (ratingMap[a.id].sum / ratingMap[a.id].count) : null,
    reviewCount: ratingMap[a.id] ? ratingMap[a.id].count : 0,
  }));

  // Populate city filter
  const cities = [...new Set(ALL_AGENTS.map(a => a.city).filter(Boolean))].sort();
  const citySelect = document.getElementById('f-city');
  cities.forEach(c => {
    const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
    citySelect.appendChild(opt);
  });

  renderGrid(ALL_AGENTS);
}

function applyFilters() {
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  const city = document.getElementById('f-city').value;
  const filtered = ALL_AGENTS.filter(a => {
    const matchesQ = !q || (a.shop_name||'').toLowerCase().includes(q) || (a.name||'').toLowerCase().includes(q);
    const matchesCity = !city || a.city === city;
    return matchesQ && matchesCity;
  });
  renderGrid(filtered);
}
function clearFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-city').value = '';
  renderGrid(ALL_AGENTS);
}

function renderGrid(list) {
  document.getElementById('results-bar').textContent = `${list.length} agents కనిపించారు`;
  const grid = document.getElementById('agent-grid');
  if (!list.length) { grid.innerHTML = '<div class="empty">ఏ ఏజెంట్ కనిపించలేదు — ఫిల్టర్ మార్చి చూడండి.</div>'; return; }

  grid.innerHTML = list.map(a => {
    const initials = (a.shop_name||'SK').trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const isPremium = a.plan_name === 'premium';
    const isVerified = a.plan_name === 'yearly' || isPremium;
    const ratingHtml = a.avgRating
      ? `<div class="ac-rating">⭐ ${a.avgRating.toFixed(1)} <span style="color:var(--text2);font-weight:400">(${a.reviewCount})</span></div>`
      : '';
    return `
    <a class="agent-card" href="${esc(a.tab)}">
      <div class="ac-top">
        <div class="ac-photo">${a.logo_url ? `<img src="${esc(a.logo_url)}"/>` : initials}</div>
        <div>
          <div class="ac-name">${esc(a.shop_name)}</div>
          ${isPremium ? '<span class="badge">⭐ Premium</span>' : isVerified ? '<span class="badge">✓ Verified</span>' : ''}
        </div>
      </div>
      ${a.intro ? `<div class="ac-intro">${esc(a.intro)}</div>` : ''}
      <div class="ac-meta">
        ${a.city ? `<div><i class="fas fa-location-dot"></i>${esc(a.city)}</div>` : ''}
      </div>
      ${ratingHtml}
      <div class="ac-btn">View Profile →</div>
    </a>`;
  }).join('');
}

loadDirectory();
</script>
</body>
</html>
